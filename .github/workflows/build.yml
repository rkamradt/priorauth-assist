name: Build and Push

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  build:
    uses: rkamradt/ci-workflows/.github/workflows/java-image.yml@main
    with:
      helm-chart-dir: priorauth-assist
      push-latest: true
    secrets: inherit
