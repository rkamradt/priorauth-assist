replicaCount: 1

image:
  repository: ghcr.io/rkamradt/priorauth-assist
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

env:
  FHIR_BASE_URL: "http://priorauth-fhir.priorauth-fhir:8080/fhir"
  MCP_TRANSPORT: "http"

# Secret name for Cloudflare Access service token
# Must exist in namespace with keys: CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
secretName: priorauth-secret

resources:
  requests:
    memory: 256Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 500m

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 5
